regles:
  - {id: evar.seances,       libelle: "Au moins 3 séances spécifiques d'éducation à la vie affective", controle: evar_seances, minimum: 3}
  - {id: eps.unites.duree,   libelle: "Unités d'apprentissage de 6 à 8 séances", controle: eps_unites}
  - {id: voc.corpus,         libelle: "3 corpus de vocabulaire par période, soit 15 sur l'année", controle: corpus_par_periode, minimum: 15}
  - {id: arts.oeuvres,       libelle: "Au moins 3 œuvres musicales patrimoniales", controle: oeuvres_patrimoniales, minimum: 3}
  - id: lang.textes.hebdo
    libelle: "Un texte mémorisé par semaine, au moins 10 comptines ou chants"
    controle: non_verifiable
    raison: >-
      les chants sont cités en prose, dans une colonne de tableau, sans liste
      structurée : on ne peut ni les compter ni vérifier le rythme hebdomadaire.
