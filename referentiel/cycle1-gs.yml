# Référentiel du programme — cycle 1, repères « à partir de 5 ans » (GS)
#
# Chaque exigence du programme devient une ligne avec un identifiant stable.
# C'est ce qui permet de la compter, de la citer, et de constater qu'elle
# manque. Les séances s'y accrochent dans `classe/annotations.yml`.
#
# ⚠ SOURCE. Ces entrées sont la décomposition des sections « Attendus
# travaillés en GS (rappel du programme) » des sept progressions de ce
# dépôt — c'est-à-dire d'une lecture déjà faite du programme, et non du
# texte officiel. Chaque entrée doit être relue contre le BO n°19 du
# 7 mai 2026 et le BO n°41 du 31 octobre 2024, et porter sa référence
# exacte. Un référentiel approximatif rendrait le contrôle faux.

source: >-
  Programme d'enseignement de l'école maternelle (cycle 1), BO n°19 du
  7 mai 2026 et BO n°41 du 31 octobre 2024 (EVAR), tels que repris dans les
  progressions de ce dépôt.
statut: decompose-a-relire

