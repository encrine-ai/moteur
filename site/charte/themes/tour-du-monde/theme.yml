# Le design system de la classe « Le tour du monde » : le carnet de voyage.
# Déclare chaque police et chaque motif du thème, avec sa licence ; contrôlé
# par scripts/verifier-theme.py (skill charte-graphique).
nom: Carnet de voyage
description: >-
  Le carnet de voyage d'un enfant de cinq ans — papier crème pointé, encre de
  stylo, cuir de valise — et trois objets du voyage pour ornements : le timbre
  (la frise, le numéro de période), le tampon de la poste (l'accueil, les
  couvertures), l'étiquette de bagage (les cahiers, la consigne). Titres
  écrits à la main (Grandstander), étiquettes tapées à la machine (Courier Prime).
retenu_le: 2026-10-18
polices:
  - famille: Grandstander
    role: titres de l'adulte (--police-titre)
    fichiers: [polices/grandstander-latin.woff2, polices/grandstander-latin-ext.woff2]
    licence: OFL-1.1
    auteur: The Grandstander Project Authors (Tyler Finck, Etcetera Type Co)
    source: https://github.com/Etcetera-Type-Co/Grandstander
  - famille: Courier Prime
    role: étiquettes, tampons, numéros (--police-etiquette)
    fichiers: [polices/courier-prime-latin-400.woff2, polices/courier-prime-latin-700.woff2,
               polices/courier-prime-latin-ext-400.woff2, polices/courier-prime-latin-ext-700.woff2]
    licence: OFL-1.1
    auteur: The Courier Prime Project Authors (Alan Dague-Greene)
    source: https://github.com/quoteunquoteapps/CourierPrime
  - famille: Atkinson Hyperlegible Next
    role: texte de l'adulte (--police-texte)
    fichiers: [polices/atkinson-next-latin.woff2, polices/atkinson-next-latin-ext.woff2, polices/atkinson-next-latin-italic.woff2]
    licence: OFL-1.1
    auteur: Braille Institute of America
    source: https://www.brailleinstitute.org/freefont/
motifs:
  - fichier: motifs/tampon.svg
    role: le tampon de la poste (accueil, titre de fiche, couverture)
    licence: CC0-1.0
    auteur: tracé pour le thème
  - fichier: motifs/obliteration.svg
    role: les ondes d'oblitération (frise, titre de fiche, couverture)
    licence: CC0-1.0
    auteur: tracé pour le thème
  - fichier: motifs/itineraire.svg
    role: l'itinéraire pointillé (accueil, page de garde)
    licence: CC0-1.0
    auteur: tracé pour le thème
  - fichier: motifs/grille.svg
    role: le papier pointé du carnet (écran, couverture)
    licence: CC0-1.0
    auteur: tracé pour le thème
  - fichier: motifs/ficelle.svg
    role: la ficelle de l'étiquette (couverture)
    licence: CC0-1.0
    auteur: tracé pour le thème
