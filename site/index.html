<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ma classe</title>
  <meta name="description" content="Toutes les progressions, la programmation et les évaluations de l'année, aux dates des vacances de la classe, à consulter et à imprimer en PDF.">
  <!-- L'appli installable (scripts/appli.py) : le manifeste et les icônes
       sont fabriqués pour la classe ; la couleur de la barre et le nom sous
       l'icône d'iOS, posés par appli.js depuis le thème et classe.yml. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="icones/appli.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
  <link rel="stylesheet" href="charte/charte.css">
  <link rel="stylesheet" href="app.css">
</head>
<body data-support="ecran">
  <!-- Trois emplacements, que remplissent les gabarits (site/gabarits.js, ou
       ceux du thème : charte/gabarits.js) à partir du modèle (modele.js) ;
       app.js garde la logique : routage, documents, menu, focus. -->
  <a class="saut" href="#contenu">Aller au contenu</a>
  <header id="entete" data-composant="entete"></header>
  <main id="contenu" data-composant="page" tabindex="-1"><p class="chargement">Chargement…</p></main>
  <footer id="pied" data-composant="pied"></footer>

  <script src="marked.min.js"></script>
  <script src="classe.js"></script>
  <script src="commun.js"></script>
  <script src="modele.js"></script>
  <script src="gabarits.js"></script>
  <script src="charte/gabarits.js"></script>
  <script src="app.js"></script>
  <script src="appli.js"></script>
</body>
</html>
