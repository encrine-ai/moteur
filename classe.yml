# La classe de démonstration du modèle — « Le tour du monde », en cours d'écriture.
# Fabriquée par scripts/extraire-moteur.py ; le skill nouvelle-classe la remplace.

nom: Classe de démonstration
niveau:
  code: GS
  libelle: Grande Section
annee: 2026-2027
projet: Le tour du monde
sous_titre: classe de démonstration
accroche: 'Une classe de démonstration en cours d’écriture : un continent par période. Les
  documents et les cahiers arriveront période par période.'
conformite: Conforme au programme officiel de l'école maternelle (cycle 1, 2024-2026) et au
  programme d'éducation à la vie affective et relationnelle.
theme: demo
# La signature de l'enseignant (skill nouvelle-classe, « Comment veux-tu
# signer ta classe ? ») : son nom tel qu'il veut le voir sur le site
# (« Claire Martin », « Mme Martin », un prénom), ou rien ; `mot`, un petit
# mot d'accueil, facultatif. Le site est public : ni l'école ni la ville par
# défaut (`ecole`, `ville` seulement s'il y tient).
# La signature fait aussi l'éditeur des mentions légales que le moteur
# fabrique (#/mentions-legales), avec pour contact le compte GitHub du
# propriétaire de `depot` ; `contact`, facultatif, le remplace (une adresse
# e-mail ou une page https://).
enseignant:
  signature: ''
  mot: ''

# Le dépôt GitHub de CETTE classe, « propriétaire/dépôt » : à définir par
# l'entretien (skill nouvelle-classe). S'il ne correspond pas au dépôt
# courant, c'est une copie faite par « Use this template » d'une classe
# partagée : l'entretien passe en mode « enrichir » et écrit `origine`
# (depot, titre, auteur, licence, site, reprise_le), que le pied du site
# crédite. `site`, facultatif : l'adresse du site quand ce n'est pas
# https://<propriétaire>.github.io/<dépôt>/ (un domaine propre) — le bloc de
# tête du README.md en tire son lien.
depot: à définir
# `mentions_legales`, facultatif : l'adresse (https://) des pages légales que
# la classe a déjà ; le pied y pointe au lieu de la page fabriquée par le
# moteur. Une classe servie par Encrine porte, elle, celles d'Encrine.
moteur:
  depot: encrine-ai/moteur
  version: null
galerie:
  depot: encrine-ai/encrine-ai.github.io
partage:
  prenoms_fictifs: []
  textes_autorises: []
contenu:
  referentiel: referentiel/cycle1-gs.yml
  annotations: classe/annotations.yml
  imagier: classe/imagier.py
  corpus: classe/corpus.py
  projet: classe/projet.yml
# La zone de vacances de la classe : ses dates viennent du calendrier officiel
